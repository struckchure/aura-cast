[package]
name = "auracast-speaker"
version = "0.1.0"
description = "Stream audio between devices on the same Wi-Fi network"
authors = ["AuraCast Audio Lab"]
edition = "2021"

[lib]
name = "auracast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }

# Cross-platform audio capture & playback (CoreAudio / WASAPI / AAudio)
cpal = "0.15"

# Opus codec for the network stream
opus = "0.3"

# Finding other AuraCast devices on the LAN
mdns-sd = "0.11"

# cpal's Android backend reads the JVM/Context from ndk-context, which Tauri
# does not initialise; MainActivity hands them over through JNI (see android.rs)
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

# System-audio capture via Core Audio process taps
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2 = "0.6"
