<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="50%" stop-color="#171717" />
      <stop offset="100%" stop-color="#0f0f0f" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with slight squircle curve -->
  <rect width="512" height="512" rx="108" fill="url(#bg)" />

  <!-- Outer acoustic pulse wave ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#f59e0b" stroke-opacity="0.15" stroke-width="4" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="6" />

  <!-- Center Speaker Subwoofer Cone -->
  <circle cx="256" cy="256" r="110" fill="#1c1917" stroke="url(#amberGlow)" stroke-width="8" filter="url(#glow)" />
  <circle cx="256" cy="256" r="70" fill="#292524" stroke="#d97706" stroke-width="4" />
  
  <!-- Speaker Dust Cap -->
  <circle cx="256" cy="256" r="36" fill="url(#amberGlow)" />

  <!-- Wireless Broadcast Rays -->
  <!-- Left Ray -->
  <path d="M 120 220 A 160 160 0 0 0 120 292" fill="none" stroke="#f59e0b" stroke-width="10" stroke-linecap="round" />
  <path d="M 85 190 A 210 210 0 0 0 85 322" fill="none" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="8" stroke-linecap="round" />

  <!-- Right Ray -->
  <path d="M 392 220 A 160 160 0 0 1 392 292" fill="none" stroke="#f59e0b" stroke-width="10" stroke-linecap="round" />
  <path d="M 427 190 A 210 210 0 0 1 427 322" fill="none" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="8" stroke-linecap="round" />
</svg>
